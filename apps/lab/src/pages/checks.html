<!-- The Checks page (src/shell/checks.ts). -->
<section class="lab-checks-bar" aria-label="Run">
  <button type="button" class="lab-btn primary" data-run="all">Run every scenario</button>
  <button type="button" class="lab-btn" data-run="motion">Motion</button>
  <button type="button" class="lab-btn" data-run="placement">Placement</button>
  <button type="button" class="lab-btn" data-run="panels">Panels</button>
  <button type="button" class="lab-btn" data-run="kits">Kit cases</button>
  <button type="button" class="lab-btn" data-run="stop" disabled>Stop</button>
  <p class="lab-checks-status" id="checks-status" role="status" aria-live="polite">Pick what to run. Each page's scenarios run in the frame below, on the real packages.</p>
</section>
<p class="lab-checks-sum" id="checks-sum" hidden></p>
<div class="lab-checks-run">
  <table class="lab-checks-table">
    <thead><tr><th>Page</th><th>Scenario</th><th>Mode</th><th>Result</th><th>First failure</th></tr></thead>
    <tbody id="checks-rows"><tr><td colspan="5">No run yet.</td></tr></tbody>
  </table>
  <figure class="lab-checks-frame" aria-label="The page being checked">
    <div class="lab-checks-viewport" id="checks-viewport"></div>
    <figcaption id="checks-frame-cap">Idle</figcaption>
  </figure>
</div>
