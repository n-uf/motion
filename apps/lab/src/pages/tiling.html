<!-- The tiling stage (src/main.ts), behind Settle and tempo and Tiling: the shell renders its header. -->
      <section class="controls" aria-label="Controls">
        <fieldset>
          <legend>Tempo</legend>
          <label><input type="radio" name="tempo" value="calm" /> Calm (ω 20)</label>
          <label><input type="radio" name="tempo" value="default" checked /> Default (ω 25)</label>
          <label><input type="radio" name="tempo" value="quick" /> Quick (ω 37)</label>
        </fieldset>
        <fieldset>
          <legend>Layout</legend>
          <label><input type="radio" name="layout" value="master" checked /> Master and stack</label>
          <label><input type="radio" name="layout" value="dwindle" /> Dwindle</label>
          <label><input type="radio" name="layout" value="columns" /> Columns</label>
          <label><input type="radio" name="layout" value="grid" /> Grid</label>
        </fieldset>
        <fieldset>
          <legend>Drop preview while dragging</legend>
          <label><input type="radio" name="drop" value="indicator" checked /> Drop indicator (window under the pointer, slot outlined)</label>
          <label><input type="radio" name="drop" value="snap" /> Snap to slot (window glides into the slot under the pointer, the others make room)</label>
          <label><input type="checkbox" id="make-room" /> Drop indicator: others make room too (live reorder)</label>
        </fieldset>
        <fieldset>
          <legend>Do</legend>
          <button type="button" data-act="open">Open a window (splits the focused one in dwindle)</button>
          <button type="button" data-act="close">Close the focused</button>
          <button type="button" data-act="swap">Swap first two</button>
          <button type="button" data-act="maximize">Maximize / restore</button>
          <button type="button" data-act="double">Two changes 40 ms apart</button>
          <button type="button" data-act="slow">Slow motion ×5</button>
          <button type="button" data-act="runall">Run all scenarios</button>
        </fieldset>
      </section>

      <div class="stage" id="stage"><div class="hint" id="hint" hidden></div></div>

      <section aria-label="Checks">
        <h2 id="checks-title">Checks of the last move</h2>
        <table id="checks">
          <thead><tr><th>Rule</th><th>Result</th><th>First failure</th></tr></thead>
          <tbody></tbody>
        </table>
        <h2>Distance to target, last move</h2>
        <canvas id="trace" width="720" height="160" aria-label="Distance to target over time, one line per window"></canvas>
        <h2>Scenario runs</h2>
        <table id="runs">
          <thead><tr><th>Scenario</th><th>Layout</th><th>Failed rules</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
