<!-- The desk stage (src/desk.ts), behind Drag intent, Held drag and previews, Desk constructions and Toolbar groups: the shell renders its header. -->
      <section class="controls" aria-label="Controls">
        <fieldset id="constructions">
          <legend>Construction</legend>
        </fieldset>
        <fieldset id="toolbar-modes">
          <legend>Toolbar</legend>
          <label><input type="radio" name="toolbar" value="top-reserved" checked /> Top · reserved</label>
          <label><input type="radio" name="toolbar" value="top-overlay" /> Top · floating</label>
          <label><input type="radio" name="toolbar" value="bottom-reserved" /> Bottom · reserved</label>
          <label><input type="radio" name="toolbar" value="bottom-overlay" /> Bottom · floating</label>
        </fieldset>
        <fieldset id="bottom-modes">
          <legend>Bottom dock</legend>
          <label><input type="radio" name="bottom" value="reserved" checked /> Reserved</label>
          <label><input type="radio" name="bottom" value="overlay" /> Floating</label>
          <label><input type="radio" name="bottom" value="off" /> Off</label>
        </fieldset>
        <fieldset>
          <legend>Stage</legend>
          <button type="button" data-act="fit" aria-pressed="true" title="Fit the stage to the page and follow the window">Fit</button>
          <label>Width <input id="w" type="range" min="480" max="1680" step="1" value="960" /><output id="wo">960</output></label>
          <label>Height <input id="h" type="range" min="320" max="960" step="1" value="560" /><output id="ho">560</output></label>
          <button type="button" data-size="1440,820">Large</button>
          <button type="button" data-size="960,560">Laptop</button>
          <button type="button" data-size="760,420">Short</button>
          <button type="button" data-size="520,700">Narrow</button>
        </fieldset>
        <fieldset>
          <legend>Preview</legend>
          <label><input type="radio" name="preview" value="indicator" /> Drop indicator</label>
          <label><input type="radio" name="preview" value="gap" /> Open gap</label>
          <label><input type="radio" name="preview" value="snap" checked /> Snap to slot</label>
        </fieldset>
        <fieldset>
          <legend>Tempo</legend>
          <label><input type="radio" name="tempo" value="calm" /> Calm (ω 20)</label>
          <label><input type="radio" name="tempo" value="default" checked /> Default (ω 25)</label>
          <label><input type="radio" name="tempo" value="quick" /> Quick (ω 37)</label>
        </fieldset>
        <fieldset>
          <legend>Do</legend>
          <button type="button" data-act="open">Open document</button>
          <button type="button" data-act="close">Close the focused</button>
          <button type="button" data-act="reset">Reset</button>
          <button type="button" data-act="runall">Run all scenarios</button>
        </fieldset>
      </section>
      <p class="idea" id="idea"></p>
      <p class="readout" id="readout"></p>

      <div class="stage desk" id="stage">
        <div class="hint" id="hint"></div>
        <div class="hint-label" id="hint-label"></div>
      </div>

      <section aria-label="Checks">
        <h2>Checks of the last move</h2>
        <table id="checks">
          <thead><tr><th>Rule</th><th>Result</th><th>First failure</th></tr></thead>
          <tbody></tbody>
        </table>
        <h2>Distance to target, last move</h2>
        <canvas id="trace" width="720" height="160" aria-label="Distance to target over time, one line per item"></canvas>
        <h2>Scenario runs</h2>
        <table id="runs">
          <thead><tr><th>Scenario</th><th>Construction</th><th>Failed rules</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
